<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suppliers | Kaunta</title>
  <meta name="theme-color" content="#ecefe9">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <script src="js/theme.js"></script>
  <link href="css/ui.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/suppliers.css" rel="stylesheet">
</head>
<body data-nav="suppliers.html">
<main class="page" id="page">
  <div class="head">
    <div><h1>Suppliers</h1><p>The people and companies you buy stock from. Tap a supplier to see their details and what you still owe them.</p></div>
    <div class="actions">
      <button class="btn primary" id="openAdd" type="button"><i class="ph ph-plus"></i>Add supplier</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search"><i class="ph ph-magnifying-glass"></i><input type="search" id="sq" placeholder="Search by name, contact or phone" autocomplete="off" aria-label="Search suppliers"></div>
    <span class="grow"></span>
    <div class="seg" id="sview" role="group" aria-label="Filter"><button type="button" data-v="active" aria-pressed="true">Active</button><button type="button" data-v="inactive" aria-pressed="false">Inactive</button><button type="button" data-v="all" aria-pressed="false">All</button></div>
    <button class="btn" id="refresh" type="button"><i class="ph ph-arrows-clockwise"></i>Refresh</button>
  </div>

  <p class="note err" id="listErr" hidden></p>
  <div id="list"></div>
  <div class="pager" id="pager" hidden><button class="btn sm" id="prev" type="button">Previous</button><span id="pageInfo"></span><button class="btn sm" id="next" type="button">Next</button></div>
</main>

<!-- Supplier details -->
<dialog class="sheet wide" id="detail" aria-labelledby="dTitle">
  <div class="sheet-h"><h2 id="dTitle">Supplier</h2><button class="icon-btn sm" type="button" data-close aria-label="Close"><i class="ph ph-x"></i></button></div>
  <div class="sheet-b" id="dBody"></div>
  <div class="sheet-f">
    <button class="btn" id="dEdit" type="button"><i class="ph ph-pencil-simple"></i>Edit</button>
    <a class="btn" href="purchases.html"><i class="ph ph-package"></i>Go to purchases</a>
    <button class="btn" type="button" data-close>Close</button>
  </div>
</dialog>

<!-- Add / edit -->
<dialog class="sheet" id="formSheet" aria-labelledby="fTitle">
  <form class="form" id="supForm" novalidate style="display:contents">
    <div class="sheet-h"><h2 id="fTitle">Add a supplier</h2><button class="icon-btn sm" type="button" data-close aria-label="Close"><i class="ph ph-x"></i></button></div>
    <div class="sheet-b">
      <label class="fld"><span>Supplier name</span><input type="text" id="fName" required autocomplete="off" placeholder="e.g. Unga Distributors Ltd"></label>
      <div class="row2">
        <label class="fld"><span>Contact person</span><input type="text" id="fContact" autocomplete="off"><small>Optional.</small></label>
        <label class="fld"><span>Phone</span><input type="tel" id="fPhone" autocomplete="off" inputmode="tel" placeholder="07..."></label>
      </div>
      <div class="row2">
        <label class="fld"><span>Email</span><input type="email" id="fEmail" autocomplete="off"></label>
        <label class="fld"><span>KRA PIN</span><input type="text" id="fPin" autocomplete="off"></label>
      </div>
      <label class="fld"><span>Address</span><input type="text" id="fAddress" autocomplete="off"></label>
      <label class="fld"><span>Payment terms (days)</span><input type="number" id="fTerms" min="0" step="1" inputmode="numeric"><small>Optional. How many days they give you to pay. Leave empty if you pay on delivery.</small></label>
      <label class="fld"><span>Notes</span><textarea id="fNotes" placeholder="Optional"></textarea></label>
      <label class="chk" id="fActiveBox"><input type="checkbox" id="fActive" checked><span><b>Active</b><small>Switch off to stop using this supplier without deleting them.</small></span></label>
      <p class="note err" id="fErr" hidden></p>
      <button class="btn danger sm" id="fDelete" type="button" style="justify-self:start" hidden><i class="ph ph-trash"></i>Delete supplier</button>
    </div>
    <div class="sheet-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="fSave" type="submit">Save supplier</button></div>
  </form>
</dialog>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script src="js/suppliers.js"></script>
</body>
</html>
