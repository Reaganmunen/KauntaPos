<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers | Kaunta</title>
  <meta name="theme-color" content="#ecefe9">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <script src="js/theme.js"></script>
  <link href="css/ui.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/customer.css" rel="stylesheet">
</head>
<body data-nav="customer.html">
<main class="page" id="page">
  <div class="head">
    <div><h1>Customers</h1><p>The people you sell to, and what each of them owes you. Tap a customer to see their account.</p></div>
    <div class="actions">
      <button class="btn primary" id="openAdd" type="button"><i class="ph ph-plus"></i>Add customer</button>
    </div>
  </div>

  <div class="cu-stats" id="stats" hidden></div>

  <div class="toolbar">
    <div class="search"><i class="ph ph-magnifying-glass"></i><input type="search" id="cq" placeholder="Search by name or phone" autocomplete="off" aria-label="Search customers"></div>
    <span class="grow"></span>
    <div class="seg" id="cview" role="group" aria-label="Filter"><button type="button" data-v="all" aria-pressed="true">Everyone</button><button type="button" data-v="owing" aria-pressed="false">Owing</button></div>
    <button class="btn" id="refresh" type="button"><i class="ph ph-arrows-clockwise"></i>Refresh</button>
  </div>

  <p class="note err" id="listErr" hidden></p>
  <div id="list"></div>
  <div class="pager" id="pager" hidden><button class="btn sm" id="prev" type="button">Previous</button><span id="pageInfo"></span><button class="btn sm" id="next" type="button">Next</button></div>
</main>

<!-- Customer account -->
<dialog class="sheet wide" id="detail" aria-labelledby="dTitle">
  <div class="sheet-h"><h2 id="dTitle">Customer</h2><button class="icon-btn sm" type="button" data-close aria-label="Close"><i class="ph ph-x"></i></button></div>
  <div class="sheet-b" id="dBody"></div>
  <div class="sheet-f">
    <button class="btn" id="dEdit" type="button"><i class="ph ph-pencil-simple"></i>Edit</button>
    <button class="btn" id="dAdjust" type="button"><i class="ph ph-sliders-horizontal"></i>Adjust balance</button>
    <button class="btn primary" id="dPay" type="button"><i class="ph ph-money"></i>Receive payment</button>
    <button class="btn" type="button" data-close>Close</button>
  </div>
</dialog>

<!-- Add / edit -->
<dialog class="sheet" id="formSheet" aria-labelledby="fTitle">
  <form class="form" id="custForm" novalidate style="display:contents">
    <div class="sheet-h"><h2 id="fTitle">Add a customer</h2><button class="icon-btn sm" type="button" data-close aria-label="Close"><i class="ph ph-x"></i></button></div>
    <div class="sheet-b">
      <label class="fld"><span>Name</span><input type="text" id="fName" required autocomplete="off"></label>
      <div class="row2">
        <label class="fld"><span>Phone</span><input type="tel" id="fPhone" autocomplete="off" inputmode="tel" placeholder="07..."></label>
        <label class="fld"><span>Email</span><input type="email" id="fEmail" autocomplete="off"></label>
      </div>
      <div class="row2">
        <label class="fld"><span>KRA PIN</span><input type="text" id="fPin" autocomplete="off"><small>Optional. Needed for tax invoices to businesses.</small></label>
        <label class="fld"><span>Credit limit (KES)</span><input type="number" id="fLimit" min="0" step="0.01" inputmode="decimal"><small>The most they can owe you. Leave empty for no credit.</small></label>
      </div>
      <label class="fld"><span>Address</span><input type="text" id="fAddress" autocomplete="off"></label>
      <label class="fld"><span>Notes</span><textarea id="fNotes" placeholder="Optional"></textarea></label>
      <label class="chk" id="fActiveBox"><input type="checkbox" id="fActive" checked><span><b>Active</b><small>Switch off to hide this customer without deleting them.</small></span></label>
      <p class="note err" id="fErr" hidden></p>
      <button class="btn danger sm" id="fDelete" type="button" style="justify-self:start" hidden><i class="ph ph-trash"></i>Delete customer</button>
    </div>
    <div class="sheet-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="fSave" type="submit">Save customer</button></div>
  </form>
</dialog>

<!-- Receive payment -->
<dialog class="modal" id="payDlg" aria-labelledby="yTitle">
  <form class="dlg form" id="payForm" novalidate>
    <div class="row"><h2 class="grow" id="yTitle">Receive payment</h2><button class="icon-btn sm" type="button" data-close aria-label="Close"><i class="ph ph-x"></i></button></div>
    <p class="muted" id="yInfo"></p>
    <div class="row2">
      <label class="fld"><span>Amount (KES)</span><input type="number" id="yAmount" min="0" step="0.01" inputmode="decimal" required></label>
      <label class="fld"><span>Paid by</span>
        <select id="yMethod">
          <option value="cash">Cash</option>
          <option value="mpesa">M-Pesa</option>
          <option value="card">Card</option>
          <option value="bank_transfer">Bank transfer</option>
          <option value="other">Other</option>
        </select>
      </label>
    </div>
    <label class="fld"><span>Reference</span><input type="text" id="yRef" autocomplete="off"><small>Optional. For example the M-Pesa code.</small></label>
    <label class="fld"><span>Note</span><input type="text" id="yNote" autocomplete="off"><small>Optional.</small></label>
    <p class="note err" id="yErr" hidden></p>
    <button class="btn primary lg block" id="yGo" type="submit">Save payment</button>
  </form>
</dialog>

<!-- Adjust balance -->
<dialog class="modal" id="adjDlg" aria-labelledby="jTitle">
  <form class="dlg form" id="adjForm" novalidate>
    <div class="row"><h2 class="grow" id="jTitle">Adjust balance</h2><button class="icon-btn sm" type="button" data-close aria-label="Close"><i class="ph ph-x"></i></button></div>
    <p class="muted" id="jInfo"></p>
    <div class="seg" id="jMode" role="group" aria-label="Direction"><button type="button" data-m="more" aria-pressed="true">Owes more</button><button type="button" data-m="less" aria-pressed="false">Owes less</button></div>
    <label class="fld"><span>Amount (KES)</span><input type="number" id="jAmount" min="0" step="0.01" inputmode="decimal" required></label>
    <p class="muted" id="jPreview"></p>
    <label class="fld"><span>Reason</span><input type="text" id="jNote" autocomplete="off" required><small>Required, so the change can be traced later.</small></label>
    <p class="note err" id="jErr" hidden></p>
    <button class="btn primary lg block" id="jGo" type="submit">Save adjustment</button>
  </form>
</dialog>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script src="js/customer.js"></script>
</body>
</html>
