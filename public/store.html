<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online store</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.ico" sizes="any" id="favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/store.css" rel="stylesheet">
</head>
<body>
<div id="announce" class="announce" hidden></div>
<header class="bar">
  <a class="shop" href="./" id="shop" aria-label="Home"><img id="logo" alt="" hidden><b id="shopName"></b></a>
  <form class="find" id="find" role="search"><input type="search" id="q" placeholder="Search products" aria-label="Search products" autocomplete="off"></form>
  <button class="cartbtn" id="cartBtn" type="button" aria-label="Open cart"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg><span class="count" id="count" hidden>0</span></button>
</header>

<main class="wrap" id="main">
  <section class="hero" id="hero" hidden aria-label="Offers"></section>
  <div class="hello" id="hello" hidden><h1 id="tagline"></h1></div>
  <nav class="cats" id="cats" aria-label="Categories" hidden></nav>
  <p class="msg" id="msg" hidden></p>
  <div class="grid" id="grid"></div>
  <div class="more"><button class="btn" id="more" type="button" hidden>Show more</button></div>
</main>

<section class="gone" id="gone" hidden>
  <h1>This store is not open right now</h1>
  <p id="goneText">The shop has not been published yet, or it is not available. Please check back soon.</p>
</section>

<footer class="foot" id="foot" hidden>
  <div class="foot-in">
    <div><b id="fName"></b><p id="fAddr"></p></div>
    <ul id="fContact"></ul>
    <ul id="fPages"></ul>
  </div>
  <p class="powered">Powered by Kaunta</p>
</footer>

<dialog id="modal" aria-labelledby="mTitle">
  <div class="m-head"><h2 id="mTitle"></h2><button class="x" id="mClose" type="button" aria-label="Close">&times;</button></div>
  <div class="m-body" id="mBody"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
</body>
</html>
