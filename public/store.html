<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online store</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#f3f5f1">
  <link rel="icon" href="favicon.ico" sizes="any" id="favicon">
  <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
    <link href="css/store.css" rel="stylesheet">
</head>
<body>
<div id="announce" class="announce" hidden></div>
<header class="bar" id="bar">
  <a class="shop" href="./" id="shop" aria-label="Home"><img id="logo" alt="" hidden><span class="mark" id="mark" hidden></span><b id="shopName"></b></a>
  <form class="find" id="find" role="search"><i class="ph ph-magnifying-glass"></i><input type="search" id="q" placeholder="Search products" aria-label="Search products" autocomplete="off"></form>
  <button class="cartbtn" id="cartBtn" type="button" aria-label="Open cart"><i class="ph ph-shopping-bag"></i><span class="count" id="count" hidden>0</span></button>
</header>

<main class="wrap" id="main">
  <section class="hero" id="hero" hidden aria-label="Offers"></section>
  <section class="intro" id="hello" hidden>
    <h1 id="tagline"></h1>
    <ul class="perks" id="perks"></ul>
  </section>
  <nav class="cats" id="cats" aria-label="Categories" hidden></nav>
  <div class="sec-h"><h2 id="secTitle">All products</h2><span class="muted" id="secCount"></span></div>
  <p class="msg" id="msg" hidden></p>
  <div class="grid" id="grid"></div>
  <div class="more"><button class="btn" id="more" type="button" hidden>Show more</button></div>
</main>

<section class="gone" id="gone" hidden>
  <span class="gone-ic"><i class="ph ph-storefront"></i></span>
  <h1>This store is not open right now</h1>
  <p id="goneText">The shop has not been published yet, or it is not available. Please check back soon.</p>
</section>

<footer class="foot" id="foot" hidden>
  <div class="foot-in">
    <div><b id="fName"></b><p id="fAddr"></p></div>
    <ul id="fContact"></ul>
    <ul id="fPages"></ul>
  </div>
  <p class="powered">Powered by Kaunta</p>
</footer>

<dialog class="sheet" id="modal" aria-labelledby="mTitle">
  <div class="sheet-h"><h2 id="mTitle"></h2><button class="x" id="mClose" type="button" aria-label="Close"><i class="ph ph-x"></i></button></div>
  <div class="sheet-b" id="mBody"></div>
  <div class="sheet-f" id="mFoot" hidden></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
</body>
</html>
