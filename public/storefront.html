<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online store | Kaunta</title>
  <meta name="theme-color" content="#ecefe9">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
  <script src="js/theme.js"></script>
  <link href="css/ui.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
</head>
<body data-nav="storefront.html">
<main class="page" id="page">
  <div class="head"><div><h1>Online store</h1><p>Put your shop online so customers can order and pay with M-Pesa. Your products, stock and prices come straight from the till.</p></div>
    <div class="actions"><span class="tag" id="liveTag">Offline</span></div></div>
  <div class="split">
    <section class="card">
      <form class="form" id="sfForm" novalidate>
        <label class="fld"><span>Store name</span><input type="text" id="sName" autocomplete="off"></label>
        <label class="fld"><span>Tagline</span><input type="text" id="sTag" autocomplete="off" placeholder="e.g. Fresh groceries, delivered fast"></label>
        <label class="fld"><span>Logo link</span><input type="url" id="sLogo" autocomplete="off" placeholder="https://..."><small>Optional. You can also upload a logo on the profile page and tick "use on my online store".</small></label>
        <div class="row2">
          <label class="fld"><span>Phone</span><input type="tel" id="sPhone" autocomplete="off"></label>
          <label class="fld"><span>WhatsApp</span><input type="tel" id="sWa" autocomplete="off"></label>
        </div>
        <label class="fld"><span>Address</span><input type="text" id="sAddr" autocomplete="off"></label>
        <label class="fld"><span>Announcement</span><input type="text" id="sAnn" autocomplete="off" placeholder="Shown at the top of your store"></label>
        <label class="fld"><span>Orders are fulfilled from</span><select id="sBranch"></select></label>
        <div class="opts">
          <label class="chk"><input type="checkbox" id="sDel" checked><span><b>Offer delivery</b><small class="muted">Customers enter an address.</small></span></label>
          <label class="chk"><input type="checkbox" id="sPick" checked><span><b>Offer pickup</b><small class="muted">Customers collect from the branch.</small></span></label>
        </div>
        <p class="note err" id="sErr" hidden></p>
        <p class="note ok" id="sOk" hidden></p>
        <div class="actions"><button class="btn primary" id="sSave" type="submit">Save</button><button class="btn gold" id="sPub" type="button"><i class="ph ph-globe"></i>Save and publish</button><button class="btn" id="sUnpub" type="button" hidden>Take offline</button></div>
        <p class="muted" id="sLive" hidden></p>
      </form>
    </section>
    <aside class="preview" aria-label="Preview of your store">
      <div class="pv-bar"><i></i><i></i><i></i><span>Preview</span></div>
      <div class="pv-ann" id="pvAnn" hidden></div>
      <div class="pv-head"><span class="av sq" id="pvLogo">K</span><b id="pvName">Your store</b><span class="pv-cart"><i class="ph ph-shopping-bag"></i></span></div>
      <p class="pv-tag" id="pvTag">Your tagline shows here</p>
      <div class="pv-grid"><span></span><span></span><span></span><span></span></div>
      <div class="pv-foot" id="pvFoot"></div>
    </aside>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script src="js/step-storefront.js"></script>
</body>
</html>
